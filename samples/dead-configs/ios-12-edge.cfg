! SYNTHETIC SAMPLE - NECROMANCER test fixture. Not a real device.
! Golden test vectors: samples/golden-flows/ios-12-edge.toml
version 12.4
hostname tomb-edge-r1
enable secret 5 $1$fake$NotARealHashAtAll00
!
interface FastEthernet0/0
 description WAN
 ip address 192.0.2.2 255.255.255.252
 ip access-group 110 in
!
interface FastEthernet0/1
 description LAN
 ip address 10.20.0.1 255.255.0.0
 ip access-group LAN_OUT in
!
! GHOST: unfiltered-interface (MGMT has no access-group; IOS permits everything by default)
interface FastEthernet0/2
 description MGMT
 ip address 10.99.0.1 255.255.255.0
!
ip route 0.0.0.0 0.0.0.0 192.0.2.1
!
access-list 10 remark vty management hosts
access-list 10 permit 10.99.0.0 0.0.0.255
! GHOST: return-traffic (stateless return rule; PAN-OS sessions make it unnecessary)
access-list 110 permit tcp any 10.20.0.0 0.0.255.255 established
access-list 110 permit tcp any host 10.20.1.10 eq 443
access-list 110 permit udp any host 10.20.1.53 eq 53
! GHOST: insecure-service (telnet to the router LAN side from WAN)
access-list 110 permit tcp any host 10.20.0.1 eq 23
access-list 110 permit icmp any any echo-reply
access-list 110 permit icmp any any time-exceeded
access-list 110 deny ip any any log
!
ip access-list extended LAN_OUT
 remark Web, DNS and the legacy X11 range
 permit tcp 10.20.0.0 0.0.255.255 any eq 80
 permit tcp 10.20.0.0 0.0.255.255 any eq 443
 permit udp 10.20.0.0 0.0.255.255 any eq 53
! GHOST: shadowed (subnet 10.20.5.0/24 already covered by the /16 rule above)
 permit tcp 10.20.5.0 0.0.0.255 any eq 443
 permit tcp 10.20.0.0 0.0.255.255 any range 6000 6010
 deny ip any any
!
snmp-server community fake-community RO 10
tacacs-server key fakeTacacsKey
!
! GHOST: insecure-management (telnet accepted on vty lines)
line vty 0 4
 access-class 10 in
 password fakeVtyPassword
 transport input telnet ssh
