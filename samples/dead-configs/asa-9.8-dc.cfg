! SYNTHETIC SAMPLE - NECROMANCER test fixture. Not a real device.
! ASA 8.3+ semantics: ACLs reference REAL (untranslated) addresses; object NAT; global ACL.
! "! GHOST:" marks seeded ghost rules. "! UNSUPPORTED:" marks lines that MUST be reported
! as security-relevant unparsed lines (never silently dropped).
! Golden test vectors: samples/golden-flows/asa-9.8-dc.toml
: Saved
ASA Version 9.8(4)
!
hostname vault-asa
enable password fakeEnablePw9876 encrypted
username necro-admin password fakeAdminPw123 encrypted privilege 15
names
!
interface GigabitEthernet0/0
 nameif outside
 security-level 0
 ip address 203.0.113.2 255.255.255.240
!
interface GigabitEthernet0/1
 nameif inside
 security-level 100
 ip address 10.50.0.1 255.255.255.0
!
interface GigabitEthernet0/2
 nameif dmz
 security-level 50
 ip address 10.60.0.1 255.255.255.0
!
interface GigabitEthernet0/3
 nameif partner
 security-level 50
 ip address 198.51.100.1 255.255.255.0
!
same-security-traffic permit inter-interface
!
time-range BUSINESS_HOURS
 periodic weekdays 8:00 to 18:00
!
object network WEB-REAL
 host 10.60.0.10
object network APP-REAL
 host 10.60.0.20
object network INSIDE-NET
 subnet 10.50.0.0 255.255.255.0
object network PARTNER-NET
 subnet 198.51.100.0 255.255.255.0
! GHOST: unused-object (LEGACY-HOST is never referenced)
object network LEGACY-HOST
 host 10.50.0.99
object service SVC-HTTPS
 service tcp destination eq https
object service SVC-APP
 service tcp destination range 9000 9010
object-group network DMZ-SERVERS
 network-object object WEB-REAL
 network-object object APP-REAL
object-group service WEB-SVCS
 service-object object SVC-HTTPS
 service-object tcp destination eq www
object-group protocol ROUTING-PROTOS
 protocol-object ospf
 protocol-object eigrp
object-group icmp-type PING-TYPES
 icmp-object echo
 icmp-object echo-reply
!
access-list OUTSIDE_IN remark Public web to DMZ (real IPs, ASA 8.3+)
access-list OUTSIDE_IN extended permit object-group WEB-SVCS any4 object-group DMZ-SERVERS
access-list OUTSIDE_IN remark App API, business hours only
access-list OUTSIDE_IN extended permit object SVC-APP any4 object APP-REAL time-range BUSINESS_HOURS
access-list OUTSIDE_IN extended permit icmp any4 object-group DMZ-SERVERS object-group PING-TYPES
! GHOST: insecure-service (FTP from the internet to the DMZ web server)
access-list OUTSIDE_IN extended permit tcp any4 object WEB-REAL eq ftp
! GHOST: shadowed (WEB-REAL https is already permitted by the WEB-SVCS rule above)
access-list OUTSIDE_IN extended permit tcp any4 host 10.60.0.10 eq https
! UNSUPPORTED: ipv6 (IR v1 is IPv4-only; must block the coverage gate until waived)
access-list OUTSIDE_IN extended permit tcp any6 any6 eq https
access-list OUTSIDE_IN extended deny ip any any log
!
access-list PARTNER_IN extended permit tcp object PARTNER-NET object APP-REAL eq 9001
access-list PARTNER_IN extended permit object-group ROUTING-PROTOS object PARTNER-NET any4
! GHOST: overly-broad (partner ip any any)
access-list PARTNER_IN extended permit ip any4 any4
! GHOST: shadowed (after permit ip any4 any4, never matches)
access-list PARTNER_IN extended deny tcp any4 object INSIDE-NET eq 3389
!
access-list GLOBAL_POLICY remark Evaluated after interface ACLs; implicit deny follows it
access-list GLOBAL_POLICY extended permit udp object INSIDE-NET any4 eq domain
access-list GLOBAL_POLICY extended permit tcp object INSIDE-NET any4 eq https
access-list GLOBAL_POLICY extended permit tcp object INSIDE-NET any4 eq www
!
object network WEB-REAL
 nat (dmz,outside) static 203.0.113.10
object network APP-REAL
 nat (dmz,outside) static 203.0.113.11
object network INSIDE-NET
 nat (inside,outside) dynamic interface
!
access-group OUTSIDE_IN in interface outside
access-group PARTNER_IN in interface partner
access-group GLOBAL_POLICY global
route outside 0.0.0.0 0.0.0.0 203.0.113.1 1
!
! GHOST: insecure-management (telnet management enabled on the inside interface)
telnet 10.50.0.0 255.255.255.0 inside
ssh 10.50.0.0 255.255.255.0 inside
snmp-server host inside 10.50.0.50 community fakeCommunity version 2c
tunnel-group 198.51.100.9 type ipsec-l2l
tunnel-group 198.51.100.9 ipsec-attributes
 ikev1 pre-shared-key fakePreSharedKey42
