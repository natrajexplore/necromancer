object-group network DMZ_PUBLIC
  network-object host web-srv
  network-object host mail-srv
object-group network DNS_SERVERS
  network-object host dns-srv
! GHOST: unused-object (LEGACY_UNUSED is never referenced)
object-group network LEGACY_UNUSED
  network-object 192.168.99.0 255.255.255.0
object-group service WEB_PORTS tcp
  port-object eq www
  port-object eq https
access-list outside_in permit tcp any object-group DMZ_PUBLIC object-group WEB_PORTS
access-list outside_in permit tcp any host mail-srv eq smtp
